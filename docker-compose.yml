version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gradesense-backend
    ports:
      - "8000:8000"
    restart: always
    environment:
      - PORT=8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gradesense-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
